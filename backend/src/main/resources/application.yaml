server:
  port: 8082

spring:
  application:
    name: fcase

  h2:
    console:
      enabled: true
      path: /h2

  datasource:
    url: jdbc:h2:mem:appdb
    username: birk
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /docs
